[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prompt-optimisation-lab"
version = "0.1.0"
description = "Reproducible, cross-model prompt optimisation and experimental analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Mattar" }]
dependencies = ["PyYAML>=6.0", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=1.0"]
dashboard = ["streamlit>=1.38", "pandas>=2.2", "plotly>=5.24"]
dev = [
  "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11",
  "types-PyYAML>=6.0",
]
all = [
  "openai>=1.50", "anthropic>=0.34", "google-genai>=1.0",
  "streamlit>=1.38", "pandas>=2.2", "plotly>=5.24",
]

[project.scripts]
promptlab = "promptlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["promptlab"]

